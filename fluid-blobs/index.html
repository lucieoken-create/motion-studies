<!DOCTYPE html>
<html lang="en" data-theme="neutral">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluid blobs · motion-studies</title>
<style>
  /* ---------- themes: change these variables to restyle the study ---------- */
  :root, [data-theme="neutral"] {
    --bg: #F4F4F1; --ink: #18181B; --surface: #E2E2DD; --accent: #CFCFC8; --accent-2: #E9E9E4;
    --muted: #5F5F66; --dark: #111113; --border: rgba(24,24,27,.14); --border-strong: rgba(24,24,27,.3);
    --font-display: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  [data-theme="hijinx"] {
    --bg: #F7F8F6; --ink: #52489C; --surface: #D4DCEF; --accent: #E5E460; --accent-2: #F8E49B;
    --muted: #625C94; --dark: #242038; --border: rgba(82,72,156,.18); --border-strong: rgba(82,72,156,.35);
    --font-display: "Bricolage Grotesque", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, sans-serif;
    --font-mono: "Space Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
  .label { font: 400 11px/1.4 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 24px 0; border-bottom: 1px solid var(--border); }
  .top a { color: var(--ink); text-decoration: none; }
  .theme-btn { font: 400 11px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); background: none; border: 1px solid var(--border-strong); padding: 8px 12px; cursor: pointer; }
  .theme-btn:hover { border-color: var(--ink); }

  .intro { padding: 128px 0 96px; display: grid; gap: 24px; max-width: 760px; }
  .eyebrow { font: 400 12px/1.4 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  h1 { font: 500 clamp(44px, 6vw, 80px)/1.02 var(--font-display); letter-spacing: -.025em; margin: 0; text-wrap: balance; }
  .lead { font-size: 21px; line-height: 1.55; margin: 0; max-width: 58ch; }

  /* ---------- the study ---------- */
  .study { position: relative; height: 420vh; }             /* scroll length: taller = slower */
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; background: var(--dark); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .meter { position: absolute; right: 32px; bottom: 32px; display: flex; gap: 16px; align-items: center; background: var(--bg); padding: 8px 12px; border: 1px solid var(--border-strong); }
  .meter .bar { width: 120px; height: 1px; background: var(--border-strong); position: relative; }
  .meter .bar i { position: absolute; left: 0; top: -1px; height: 3px; background: var(--ink); width: 0; }

  .foot { display: flex; justify-content: space-between; padding: 24px 0 48px; border-top: 1px solid var(--border); margin-top: 96px; }
  .foot a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--border-strong); }
  @media (max-width: 760px) { .wrap { padding: 0 24px; } .meter { display: none; } }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="label" href="../">← motion-studies</a>
      <button class="theme-btn" id="themeBtn">Theme: neutral</button>
    </header>
    <section class="intro">
      <span class="eyebrow">Motion study · fluid blobs</span>
      <h1>Drops that pool together</h1>
      <p class="lead">Scattered drops drift on their own. Scrolling pulls them into one mass, then floods the screen with it. Your pointer is a drop too: bring it close and the others reach for it.</p>
    </section>
  </div>

  <section class="study" id="study">
    <div class="stage" id="stage">
      <canvas id="canvas" aria-hidden="true"></canvas>
      <div class="meter" aria-hidden="true"><span class="label" id="phase"></span><span class="bar"><i id="bar"></i></span></div>
    </div>
  </section>

  <div class="wrap">
    <footer class="foot">
      <span class="label">Made by Lucie Oken · <a href="https://hijinx.studio">hijinx.studio</a></span>
      <span class="label">MIT license</span>
    </footer>
  </div>

<script>
/* theme toggle: add #hijinx to the URL to open in the hijinx theme */
(() => {
  const root = document.documentElement, btn = document.getElementById('themeBtn');
  const fonts = () => { if (document.getElementById('hjFonts')) return;
    const l = document.createElement('link'); l.id = 'hjFonts'; l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500&family=IBM+Plex+Sans:wght@400;500&family=Space+Mono&display=swap';
    document.head.appendChild(l); };
  const set = t => { root.dataset.theme = t; btn.textContent = 'Theme: ' + t; if (t === 'hijinx') fonts();
    document.dispatchEvent(new CustomEvent('themechange', { detail: t })); };
  if (location.hash === '#hijinx') set('hijinx');
  addEventListener('hashchange', () => set(location.hash === '#hijinx' ? 'hijinx' : 'neutral'));
  btn.addEventListener('click', () => set(root.dataset.theme === 'hijinx' ? 'neutral' : 'hijinx'));
})();

/* the study */
(() => {
  const root = document.documentElement;
  const section = document.getElementById('study'), stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
  const bar = document.getElementById('bar'), phase = document.getElementById('phase');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const seg = (p, a, b) => clamp((p - a) / (b - a));                    // a slice of scroll progress, as 0..1
  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;     // ease in-out cubic
  const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  const mix = (a, b, k) => { const A = rgb(a), B = rgb(b);                // blend two hex colors
    return '#' + A.map((v, i) => Math.round(lerp(v, B[i], k)).toString(16).padStart(2, '0')).join(''); };

  // colors and fonts are read from the theme variables, so a new theme restyles the drawing too
  const C = {};
  const readTheme = () => { const s = getComputedStyle(root);
    for (const n of ['bg', 'ink', 'surface', 'accent', 'accent-2', 'dark', 'font-display']) C[n] = s.getPropertyValue('--' + n).trim(); };

  // this one is drawn pixel by pixel, so the canvas is kept small and stretched to fit
  let W, H, PX, img, px32;
  const size = () => {
    PX = stage.clientWidth > 1400 ? 3 : 2;       // screen pixels per drawn pixel: raise it if this runs slowly
    W = Math.ceil(stage.clientWidth / PX); H = Math.ceil(stage.clientHeight / PX);
    canvas.width = W; canvas.height = H;
    img = ctx.createImageData(W, H); px32 = new Uint32Array(img.data.buffer);
  };

  // the drops: where each one lives (-1..1 across the stage), its size, color and drift speed
  const DROPS = [
    { x: -.78, y: -.52, r: 1.1, c: 0, s: .50 }, { x: -.30, y: .58, r: .9, c: 1, s: .70 }, { x: .12, y: -.66, r: 1.0, c: 2, s: .40 },
    { x: .66, y: -.30, r: 1.2, c: 3, s: .60 }, { x: .82, y: .56, r: .8, c: 0, s: .80 }, { x: -.60, y: .12, r: .7, c: 2, s: .90 },
    { x: .30, y: .30, r: 1.0, c: 1, s: .55 }, { x: -.08, y: -.10, r: .8, c: 3, s: .65 }, { x: .46, y: .74, r: .6, c: 4, s: .75 },
  ];
  const REST = .6;                               // the still frame shown when motion is turned off
  const PHASES = [[0, 'Drops'], [.08, 'Gathering'], [.6, 'One'], [.74, 'Flooding']];
  const RIM = 1.22;                              // how thick the outline is (1 = none)

  const ptr = { x: 0, y: 0, on: false, k: 0 };
  stage.addEventListener('pointermove', e => { const r = stage.getBoundingClientRect();
    ptr.x = (e.clientX - r.left) / PX; ptr.y = (e.clientY - r.top) / PX; ptr.on = true; });
  stage.addEventListener('pointerleave', () => ptr.on = false);

  function draw(p, t) {
    // timing: change these ranges to retime the study
    const gather = ease(seg(p, .08, .6));               // drops move in and grow
    const flood = ease(seg(p, .72, 1));                 // the mass swells past the edges of the stage
    const unit = Math.min(W, H), reach = lerp(1, .36, gather);
    ptr.k += ((ptr.on && !reduce ? 1 : 0) - ptr.k) * .08;   // the pointer's drop fades in and out

    const fill = [C.accent, C.surface, C['accent-2'], mix(C.ink, C.bg, .45), C.bg].map(rgb);
    const rim = rgb(mix(C.ink, C.surface, .3)), n = DROPS.length + 1;
    const bx = [], by = [], rr = [], col = [];
    DROPS.forEach((d, i) => {
      let x = W / 2 + (d.x * reach + .1 * Math.sin(t * d.s + i)) * W * .46;
      let y = H / 2 + (d.y * reach + .1 * Math.cos(t * d.s * .8 + i * 2)) * H * .42;
      x += (ptr.x - x) * .14 * ptr.k; y += (ptr.y - y) * .14 * ptr.k;      // lean toward the pointer
      const r = d.r * unit * lerp(.085, .11, gather) * (1 + flood * 5);
      bx.push(x); by.push(y); rr.push(r * r); col.push(fill[d.c]);
    });
    bx.push(ptr.x); by.push(ptr.y); rr.push(Math.pow(unit * .1 * ptr.k, 2)); col.push(fill[4]);

    // every drop pushes on every pixel, more strongly up close. where the pushes add up past 1
    // there is liquid, and the pixel takes the color of the drop pushing hardest.
    for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++) {
      let sum = 0, top = 0, next = 0, c = rim, c2 = rim;
      for (let b = 0; b < n; b++) {
        const dx = x - bx[b], dy = y - by[b], f = rr[b] / (dx * dx + dy * dy + 1);
        sum += f;
        if (f > top) { next = top; c2 = c; top = f; c = col[b]; } else if (f > next) { next = f; c2 = col[b]; }
      }
      if (sum < 1) { px32[i] = 0; continue; }           // no liquid here: leave the pixel clear
      // three short blends keep the edges smooth: between two drops, into the outline, and out to nothing
      const k = .5 + .5 * clamp((top - next) / (top * .05)), o = clamp((sum - RIM) / .04);
      const r = lerp(rim[0], lerp(c2[0], c[0], k), o), g = lerp(rim[1], lerp(c2[1], c[1], k), o), bl = lerp(rim[2], lerp(c2[2], c[2], k), o);
      px32[i] = ((clamp((sum - 1) / .05) * 255 << 24) | (bl << 16) | (g << 8) | r) >>> 0;
    }
    ctx.putImageData(img, 0, 0);
  }


  function frame(now) {
    const r = section.getBoundingClientRect();
    if (r.bottom > 0 && r.top < innerHeight) {                           // only draw while the study is on screen
      const p = reduce ? REST : clamp(-r.top / (r.height - innerHeight));
      draw(p, reduce ? 0 : now / 1000);                                  // p = scroll progress, second value = seconds
      bar.style.width = (p * 100) + '%';
      phase.textContent = PHASES.filter(s => p >= s[0]).pop()[1];
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  const still = () => { if (reduce) frame(0); };                         // reduced motion: one finished frame, redrawn only when needed
  readTheme(); size(); requestAnimationFrame(frame);
  addEventListener('resize', () => { size(); still(); });
  document.addEventListener('themechange', () => { readTheme(); still(); });
  if (document.fonts) document.fonts.addEventListener('loadingdone', still);
})();
</script>
</body>
</html>
